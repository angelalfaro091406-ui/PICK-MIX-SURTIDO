<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick & Mix - Liverpool</title>

  <!-- PWA & Mobile Settings -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e11d48">

  <style>
    :root {
      --primary: #e11d48;
      --primary-dark: #be123c;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: white;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    .header-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      font-size: 26px;
    }

    .brand h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand p {
      font-size: 11px;
      opacity: 0.9;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .btn-export {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
    }

    .btn-clear {
      background-color: rgba(0, 0, 0, 0.25);
      color: white;
    }

    .btn:active {
      transform: scale(0.95);
    }

    /* MAIN CONTAINER */
    main {
      max-width: 800px;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* CARDS & SECTIONS */
    .section-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #1e293b;
    }

    /* FORM GRID */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
      .col-span-2 {
        grid-column: span 2;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input, .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s;
    }

    .field input:focus, .field select:focus {
      border-color: var(--primary);
    }

    .btn-submit {
      background-color: var(--primary);
      color: white;
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      margin-top: 6px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2);
    }

    /* CONTROLES DE FILTRO */
    .filter-bar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    @media (min-width: 500px) {
      .filter-bar {
        flex-direction: row;
        justify-content: space-between;
      }
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-size: 13px;
    }

    /* LISTA DE REGISTROS */
    .records-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) {
      .records-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* TARJETA DULCE */
    .candy-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      border: 1px solid var(--border-color);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    .card-stripe {
      position: absolute;
      top: 0;
      left: 0;
      width: 6px;
      height: 100%;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      padding-left: 6px;
    }

    .table-badge {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 4px;
    }

    /* MESAS BADGES */
    .badge-Roja { background: #ffe4e6; color: #e11d48; border: 1px solid #fecdd3; }
    .badge-Azul { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }
    .badge-Verde { background: #dcfce7; color: #16a34a; border: 1px solid #bbf7d0; }
    .badge-Amarilla { background: #fef3c7; color: #d97706; border: 1px solid #fde68a; }
    .badge-Naranja { background: #ffedd5; color: #ea580c; border: 1px solid #fed7aa; }
    .badge-Morada { background: #f3e8ff; color: #9333ea; border: 1px solid #e9d5ff; }
    .badge-Otra { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }

    .candy-name {
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }

    .candy-sku {
      font-size: 11px;
      color: #94a3b8;
      font-family: monospace;
    }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }

    /* SEMÁFORO STATUS */
    .status-OK { background: #dcfce7; color: #15803d; }
    .status-ALERTA { background: #fef3c7; color: #b45309; }
    .status-VENCIDO, .status-HOY { background: #ffe4e6; color: #be123c; }

    .stripe-OK { background: #22c55e; }
    .stripe-ALERTA { background: #f59e0b; }
    .stripe-VENCIDO, .stripe-HOY { background: #ef4444; }

    .card-info-grid {
      background-color: #f8fafc;
      border-radius: 10px;
      padding: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      font-size: 11px;
      margin-bottom: 12px;
      margin-left: 6px;
    }

    .info-item span:first-child {
      color: #94a3b8;
      display: block;
    }

    .info-item span:last-child {
      font-weight: 700;
      color: #334155;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
      padding-left: 6px;
    }

    .btn-rotate {
      background: none;
      border: none;
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-delete:hover {
      color: #ef4444;
    }

    /* MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }

    .modal-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .modal-cancel { background: #f1f5f9; color: #475569; }
    .modal-confirm { background: var(--primary); color: white; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header>
    <div class="header-container">
      <div class="brand">
        <span class="brand-icon">🍬</span>
        <div>
          <h1>Pick & Mix Liverpool</h1>
          <p>Control de Rotación y Frescura</p>
        </div>
      </div>
      <div class="header-actions">
        <button onclick="exportarCSV()" class="btn btn-export">
          📥 Exportar
        </button>
        <button onclick="confirmarVaciarTodo()" class="btn btn-clear">
          🗑️
        </button>
      </div>
    </div>
  </header>

  <main>

    <!-- FORMULARIO DE REGISTRO -->
    <section class="section-card">
      <div class="section-title">
        <span>➕</span> Registrar Dulce en Exhibición
      </div>

      <form id="formDulce" onsubmit="guardarRegistro(event)" class="form-grid">
        
        <div class="field">
          <label>Nombre del Dulce</label>
          <input type="text" id="nombre" required placeholder="Ej. Gomitas de Panda">
        </div>

        <div class="field">
          <label>Código o SKU</label>
          <input type="text" id="codigo" required placeholder="Ej. 12345678">
        </div>

        <div class="field">
          <label>Mesa / Exhibidor</label>
          <select id="mesa" required onchange="actualizarDiasRecomendados()">
            <option value="Roja">🔴 Mesa Roja (Gomitas - 15 días)</option>
            <option value="Azul">🔵 Mesa Azul (Caramelos duros - 30 días)</option>
            <option value="Verde">🟢 Mesa Verde (Botanas - 10 días)</option>
            <option value="Amarilla">🟡 Mesa Amarilla (Chocolates - 30 días)</option>
            <option value="Naranja">🟠 Mesa Naranja (Chiles - 20 días)</option>
            <option value="Morada">🟣 Mesa Morada (Especiales - 15 días)</option>
            <option value="Otra">⚪ Otra Sección</option>
          </select>
        </div>

        <div class="field">
          <label>Peso Colocado</label>
          <input type="text" id="peso" required placeholder="Ej. 2.5 kg o 500 g">
        </div>

        <div class="field">
          <label>Fecha de Exhibición</label>
          <input type="date" id="fechaIngreso" required onchange="calcularFechaCambio()">
        </div>

        <div class="field">
          <label>Días para Rotación</label>
          <input type="number" id="diasVida" value="15" min="1" required>
        </div>

        <div class="col-span-2">
          <button type="submit" class="btn-submit">
            Guardar Dulce
          </button>
        </div>
      </form>
    </section>

    <!-- BÚSQUEDA Y FILTRO -->
    <section class="filter-bar">
      <input type="text" id="buscador" oninput="renderizarRegistros()" placeholder="🔎 Buscar dulce o código SKU..." class="search-input">
      
      <select id="filtroMesa" onchange="renderizarRegistros()" class="search-input" style="max-width: 200px;">
        <option value="TODAS">Todas las Mesas</option>
        <option value="Roja">Mesa Roja</option>
        <option value="Azul">Mesa Azul</option>
        <option value="Verde">Mesa Verde</option>
        <option value="Amarilla">Mesa Amarilla</option>
        <option value="Naranja">Mesa Naranja</option>
        <option value="Morada">Mesa Morada</option>
        <option value="Otra">Otras</option>
      </select>
    </section>

    <!-- LISTA DE DULCES -->
    <section id="contenedorLista" class="records-grid">
      <!-- Se genera con JavaScript -->
    </section>

  </main>

  <!-- MODAL DE BORRADO -->
  <div id="modalConfirmacion" class="modal-overlay hidden">
    <div class="modal-card">
      <div style="font-size: 32px; margin-bottom: 8px;">⚠️</div>
      <h3 id="modalTitulo" style="font-size: 16px; font-weight: 700;">¿Eliminar?</h3>
      <p id="modalMensaje" style="font-size: 12px; color: #64748b; margin-top: 4px;">Esta acción no se puede deshacer.</p>
      <div class="modal-buttons">
        <button onclick="cerrarModal()" class="modal-btn modal-cancel">Cancelar</button>
        <button id="btnConfirmarAccion" class="modal-btn modal-confirm">Eliminar</button>
      </div>
    </div>
  </div>

  <script>
    let registros = JSON.parse(localStorage.getItem('pick_mix_dulces')) || [];
    let idEliminar = null;
    let vaciarTodoFlag = false;

    const reglasMesas = {
      'Roja': 15, 'Azul': 30, 'Verde': 10, 'Amarilla': 30, 'Naranja': 20, 'Morada': 15, 'Otra': 15
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fechaIngreso').value = new Date().toISOString().split('T')[0];
      actualizarDiasRecomendados();
      renderizarRegistros();
    });

    function actualizarDiasRecomendados() {
      const mesa = document.getElementById('mesa').value;
      document.getElementById('diasVida').value = reglasMesas[mesa] || 15;
    }

    function guardarRegistro(e) {
      e.preventDefault();
      const nombre = document.getElementById('nombre').value.trim();
      const codigo = document.getElementById('codigo').value.trim();
      const mesa = document.getElementById('mesa').value;
      const peso = document.getElementById('peso').value.trim();
      const fechaIngreso = document.getElementById('fechaIngreso').value;
      const diasVida = parseInt(document.getElementById('diasVida').value);

      const fechaObj = new Date(fechaIngreso + 'T00:00:00');
      fechaObj.setDate(fechaObj.getDate() + diasVida);
      const fechaCambio = fechaObj.toISOString().split('T')[0];

      registros.unshift({
        id: Date.now(), nombre, codigo, mesa, peso, fechaIngreso, diasVida, fechaCambio
      });

      guardarEnLocalStorage();
      renderizarRegistros();

      document.getElementById('nombre').value = '';
      document.getElementById('codigo').value = '';
      document.getElementById('peso').value = '';
    }

    function obtenerEstadoSemaforo(fechaCambio) {
      const hoy = new Date();
      hoy.setHours(0,0,0,0);
      const limite = new Date(fechaCambio + 'T00:00:00');
      const diff = Math.ceil((limite - hoy) / (1000 * 60 * 60 * 24));

      if (diff < 0) return { estado: 'VENCIDO', mensaje: `Vencido (${Math.abs(diff)}d)` };
      if (diff === 0) return { estado: 'HOY', mensaje: '¡Cambiar HOY!' };
      if (diff <= 3) return { estado: 'ALERTA', mensaje: `Cambio en ${diff}d` };
      return { estado: 'OK', mensaje: `Fresco (${diff}d)` };
    }

    function renderizarRegistros() {
      const contenedor = document.getElementById('contenedorLista');
      const busqueda = document.getElementById('buscador').value.toLowerCase();
      const filtroMesa = document.getElementById('filtroMesa').value;

      contenedor.innerHTML = '';

      const filtrados = registros.filter(r => {
        const matchSearch = r.nombre.toLowerCase().includes(busqueda) || r.codigo.toLowerCase().includes(busqueda);
        const matchMesa = filtroMesa === 'TODAS' || r.mesa === filtroMesa;
        return matchSearch && matchMesa;
      });

      if (filtrados.length === 0) {
        contenedor.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 30px; background: white; border-radius: 14px; color: #94a3b8; font-size: 13px;">
            Sin registros en esta vista.
          </div>
        `;
        return;
      }

      filtrados.forEach(r => {
        const semaforo = obtenerEstadoSemaforo(r.fechaCambio);

        const card = document.createElement('div');
        card.className = "candy-card";
        card.innerHTML = `
          <div class="card-stripe stripe-${semaforo.estado}"></div>
          
          <div>
            <div class="card-header">
              <div>
                <span class="table-badge badge-${r.mesa}">Mesa ${r.mesa}</span>
                <div class="candy-name">${r.nombre}</div>
                <div class="candy-sku">SKU: ${r.codigo}</div>
              </div>

              <span class="status-badge status-${semaforo.estado}">${semaforo.mensaje}</span>
            </div>

            <div class="card-info-grid">
              <div class="info-item"><span>Exhibido:</span><span>${r.fechaIngreso}</span></div>
              <div class="info-item"><span>Fecha Cambio:</span><span>${r.fechaCambio}</span></div>
              <div class="info-item"><span>Peso:</span><span>${r.peso}</span></div>
              <div class="info-item"><span>Vida útil:</span><span>${r.diasVida} días</span></div>
            </div>
          </div>

          <div class="card-footer">
            <button onclick="rotarHoy(${r.id})" class="btn-rotate">
              🔄 Rotar Hoy
            </button>
            <button onclick="confirmarEliminarUnico(${r.id}, '${r.nombre}')" class="btn-delete">
              🗑️
            </button>
          </div>
        `;
        contenedor.appendChild(card);
      });
    }

    function rotarHoy(id) {
      const hoy = new Date().toISOString().split('T')[0];
      registros = registros.map(r => {
        if (r.id === id) {
          const fechaObj = new Date(hoy + 'T00:00:00');
          fechaObj.setDate(fechaObj.getDate() + r.diasVida);
          return { ...r, fechaIngreso: hoy, fechaCambio: fechaObj.toISOString().split('T')[0] };
        }
        return r;
      });
      guardarEnLocalStorage();
      renderizarRegistros();
    }

    function confirmarEliminarUnico(id, nombre) {
      idEliminar = id;
      vaciarTodoFlag = false;
      document.getElementById('modalTitulo').textContent = '¿Eliminar dulce?';
      document.getElementById('modalMensaje').textContent = `Se borrará "${nombre}".`;
      document.getElementById('modalConfirmacion').classList.remove('hidden');
    }

    function confirmarVaciarTodo() {
      if (registros.length === 0) return;
      vaciarTodoFlag = true;
      document.getElementById('modalTitulo').textContent = '¿Vaciar lista?';
      document.getElementById('modalMensaje').textContent = 'Se borrarán TODOS los registros.';
      document.getElementById('modalConfirmacion').classList.remove('hidden');
    }

    document.getElementById('btnConfirmarAccion').addEventListener('click', () => {
      if (vaciarTodoFlag) registros = [];
      else if (idEliminar) registros = registros.filter(r => r.id !== idEliminar);
      guardarEnLocalStorage();
      renderizarRegistros();
      cerrarModal();
    });

    function cerrarModal() {
      idEliminar = null;
      vaciarTodoFlag = false;
      document.getElementById('modalConfirmacion').classList.add('hidden');
    }

    function guardarEnLocalStorage() {
      localStorage.setItem('pick_mix_dulces', JSON.stringify(registros));
    }

    function exportarCSV() {
      if (registros.length === 0) return alert('No hay datos para exportar.');
      let csv = 'Nombre,Codigo SKU,Mesa,Peso,Fecha Ingreso,Dias Vida,Fecha Cambio,Estado\n';
      registros.forEach(r => {
        const semaforo = obtenerEstadoSemaforo(r.fechaCambio);
        csv += `"${r.nombre}","${r.codigo}","${r.mesa}","${r.peso}","${r.fechaIngreso}",${r.diasVida},"${r.fechaCambio}","${semaforo.estado}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Reporte_Pick_Mix_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }
  </script>
</body>
</html>
